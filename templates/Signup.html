<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='Styling/style.css') }}">
    <link href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@200,300,400,500,600,700&display=swap"
        rel="stylesheet">
    <title>Sign up</title>
</head>

<body>
    <div class="container">
        <h1>SIGN UP</h1>
        <br>
        <p>Make sure to Complete with real details </p>
        <br>
        <form>
            <label for="username">Username:</label>
            <br>
            <input type="text" id="username" name="username">
            <br>
            <label for="email">Email:</label>
            <br>
            <input type="email" id="email" name="email">
            <br>
            <label for="password">Password:</label>
            <br>
            <input type="password" type="hidden" id="password" name="Password">

            <button type="submit"><a href="Login.html">SIGN UP</a></button>
        </form>
    </div>

    <img src="img/undraw_all-checked_d3u6.svg" alt="checklist" class="check">
    <img src="img/Winking_Emoji_Render-removebg-preview.png" alt="" class="wink">
</body>

</html>
