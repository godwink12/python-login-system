<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='Styling/style.css') }}">
    <link href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@200,300,400,500,600,700&display=swap"
        rel="stylesheet">
    <title>Sign up</title>
</head>

<body>
    <div class="container">
        <h1>SIGN UP</h1>
        <br>
        <p>Make sure to Complete with real details </p>
        <br>
        {% if error %}
        <p>{{ error }}</p>
        {% endif %}
        <form action="/register" method="POST" >
            <label for="username">Username:</label>
            <br>
            <input type="text" id="username" name="username">
            <br>
            <label for="password">Password:</label>
            <br>
            <input type="password" name="password">

            <button type="submit">SIGN UP</button>
        </form>
    </div>

    <img src="static/img/undraw_all-checked_d3u6.svg" alt="checklist" class="check">
    <img src="static/img/Winking_Emoji_Render-removebg-preview.png" alt="" class="wink">
</body>

</html>
