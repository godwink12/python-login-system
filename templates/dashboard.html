<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='Styling/style.css') }}">
    <link href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@200,300,400,500,600,700&display=swap"
        rel="stylesheet">
    <title>Document</title>
</head>

<body>
    <nav class="navbar">
        <div>
            <h1>CHECK • LIST</h1>
            <a class="dashboard" href="#">Dashboard</a>
        </div>
        <img src="img/undraw_all-checked_d3u6.svg" alt="" width="100%" height="100vh">
        <button class="logout-btn" onclick="window.location='Login.html'">LOGOUT</button>
    </nav>

    <section>
        <div class="main-content">
            <h1>Welcome back,{{username}}!</h1>
            <hr>
            <div class="profile-card">

                <!-- Top section - Avatar -->
                <div class="avatar">
                    CL
                </div>

                <!-- Middle section - User info -->
                <div class="profile-info">
                    <h2>{{Username}}</h2>
                    <p>Member since 2025</p>
                </div>

                <!-- Bottom section - Actions -->
                <div class="profile-actions">
                    <button class="change">Change Password</button>
                    <br>
                    <br>
                    <button class="delete">Delete Account</button>
                </div>

            </div>

            <div class="summary-card">
                <h2>Task Summary</h2>

                <div class="summary-items">

                    <div class="summary-item">
                        <span class="summary-icon">📋</span>
                        <span class="summary-number">5</span>
                        <span class="summary-label">Total Tasks</span>
                    </div>
                    <hr class="divider">
                    <div class="summary-item">
                        <span class="summary-icon">✔ </span>
                        <span class="summary-number">3</span>
                        <span class="summary-label">Completed</span>
                    </div>
                    <hr class="divider">
                    <div class="summary-item">
                        <span class="summary-icon">⏳</span>
                        <span class="summary-number">2</span>
                        <span class="summary-label">Remaining</span>
                    </div>

                </div>
            </div>
        </div>
    </section>

    <section>
        <div class="bottom-cards">
            <div class="checklist-card">

                <!-- Card title -->
                <h1>My Checklist</h1>

                <!-- Add task section -->
                <div class="add-task">
                    <input type="text" placeholder="Add a new task...">
                    <button>Add</button>
                </div>

                <!-- Task list -->
                <ul class="task-list">
                    <li>
                        <input type="checkbox">
                        <span>Buy groceries</span>
                    </li>
                    <br>
                    <li>
                        <input type="checkbox">
                        <span>Finish dashboard UI</span>
                    </li>
                    <br>
                    <li>
                        <input type="checkbox">
                        <span>Learn Flask</span>
                    </li>
                </ul>
            </div>
            <div class="progress-card">
                <h1>Task Progress</h1>

                <div class="ring-container">
                    <div class="ring"></div>
                    <div class="ring-center">
                        <span class="percentage">0%</span>
                    </div>

                    <p class="ring-label">0 0f 3 completed</p>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
