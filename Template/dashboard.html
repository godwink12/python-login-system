<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Styling/dashboard.css">
    <link href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@200,300,400,500,600,700&display=swap"
        rel="stylesheet">
    <title>Document</title>
</head>

<body>
    <nav class="navbar">
        <div>
            <h1>☑ CHECKLIST</h1>
            <a class="dashboard" href="#">Dashboard</a>
        </div>
        <button class="logout-btn" onclick="window.location='Login.html'">LOGOUT</button>
    </nav>

    <section>
        <div class="main-content">
            <h1>Welcome back,[username]!</h1>
            <div class="profile-card">

                <!-- Top section - Avatar -->
                <div class="avatar">
                    CL 
                </div>

                <!-- Middle section - User info -->
                <div class="profile-info">
                    <h2>Username</h2>
                    <p>Member since 2025</p> 
                </div>

                <!-- Bottom section - Actions -->
                <div class="profile-actions">
                    <button class="change">Change Password</button>
                    <br>
                    <br>
                    <button class="delete">Delete Account</button>
                </div>

            </div>
        </div>
    </section>
